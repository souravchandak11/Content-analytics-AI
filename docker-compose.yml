version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: content_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - content_analytics_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: content_analytics_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - content_analytics_network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: content_analytics_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_analytics
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - content_analytics_network

  # Streamlit Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: content_analytics_dashboard
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_analytics
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./data:/app/data
    networks:
      - content_analytics_network

  # ETL Worker (for scheduled data collection)
  etl_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: etl
    container_name: content_analytics_etl
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/content_analytics
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - content_analytics_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  content_analytics_network:
    driver: bridge
