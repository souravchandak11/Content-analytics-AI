services:
  # FastAPI Backend
  - type: web
    name: content-analytics-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    target: api
    dockerCommand: uvicorn server.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: content-analytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: content-analytics-redis
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000

  # Streamlit Dashboard
  - type: web
    name: content-analytics-streamlit
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    target: dashboard
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: content-analytics-api
          property: url
      - key: PORT
        value: 8501

  # Redis Cache
  - type: redis
    name: content-analytics-redis
    plan: free
    ipAllowList: []

databases:
  - name: content-analytics-db
    databaseName: content_analytics
    user: admin
    plan: free

version: "1"
