services:
  # FastAPI Backend
  - type: web
    name: content-analytics-api
    runtime: docker
    plan: free
    dockerTarget: api
    dockerCommand: uvicorn server.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: content-analytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: content-analytics-redis
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: PORT
        value: 10000

  # Streamlit Dashboard
  - type: web
    name: content-analytics-streamlit
    runtime: docker
    plan: free
    dockerTarget: dashboard
    dockerCommand: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    envVars:
      - key: API_URL
        value: http://content-analytics-api:10000
      - key: PORT
        value: 8501

  # Redis Cache
  - type: redis
    name: content-analytics-redis
    plan: free
    ipAllowList: []

databases:
  - name: content-analytics-db
    databaseName: content_analytics
    plan: free

version: "1"
